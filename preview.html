<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meta Campaign Cleaner</title>

  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <style>
    :root {
      --fbtool-panel-bg: #0f1715;
      --fbtool-deep-bg: #0b1210;
      --fbtool-control-bg: #121f1b;

      --fbtool-border: #2b433a;
      --fbtool-border-soft: #22372f;
      --fbtool-border-input: #2f4a40;

      --fbtool-text: #e8fff0;
      --fbtool-label: #c7e0d2;
      --fbtool-muted: #99b3a6;

      --fbtool-accent: #4dff8f;
      --fbtool-accent-text: #052012;

      --fbtool-success: #9bff7d;
      --fbtool-warning: #ffd27d;
      --fbtool-error: #ff8f8f;

      --fbtool-radius-control: 9px;
      --fbtool-radius-log: 10px;
      --fbtool-radius-modal: 14px;

      --fbtool-shadow-modal: 0 24px 60px rgba(0, 0, 0, 0.45);

      --fbtool-font: Inter, "Segoe UI", Arial, sans-serif;
      --fbtool-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 16px;
      background: var(--fbtool-deep-bg);
      color: var(--fbtool-text);
      font-family: var(--fbtool-font);
    }

    .fbtool {
      width: min(420px, calc(100vw - 24px));
      max-height: calc(100vh - 40px);
      overflow: auto;
      display: flex;
      flex-direction: column;
      background: var(--fbtool-panel-bg);
      color: var(--fbtool-text);
      border: 1px solid var(--fbtool-border);
      border-radius: var(--fbtool-radius-modal);
      box-shadow: var(--fbtool-shadow-modal);
      font: 13px/1.4 var(--fbtool-font);
      padding: 14px;
    }

    .fbtool__header {
      position: relative;
      padding-right: 34px;
      margin-bottom: 10px;
    }

    .fbtool__title {
      margin: 0;
      color: var(--fbtool-accent);
      font-size: 32px;
      line-height: 1.05;
      font-weight: 800;
      letter-spacing: 0.01em;
    }

    .fbtool__meta {
      margin-top: 4px;
      color: var(--fbtool-muted);
      font-size: 11px;
    }

    .fbtool__label {
      display: block;
      margin: 8px 0 4px;
      color: var(--fbtool-label);
      font-size: 12px;
      font-weight: 500;
    }

    input,
    button {
      width: 100%;
      border-radius: var(--fbtool-radius-control);
      border: 1px solid var(--fbtool-border-input);
      background: var(--fbtool-control-bg);
      color: var(--fbtool-text);
      padding: 9px;
      font: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--fbtool-accent);
    }

    input[type="file"]::file-selector-button {
      margin-right: 10px;
      border: 0;
      border-radius: 8px;
      background: var(--fbtool-accent);
      color: var(--fbtool-accent-text);
      padding: 7px 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .fbtool__btn {
      margin-top: 10px;
      cursor: pointer;
      font-weight: 700;
      transition: border-color 160ms ease, opacity 160ms ease;
    }

    .fbtool__btn:hover {
      border-color: var(--fbtool-accent);
    }

    .fbtool__btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .fbtool__btn--primary {
      background: var(--fbtool-accent);
      color: var(--fbtool-accent-text);
      border-color: var(--fbtool-accent);
    }

    .fbtool__log-label {
      margin-top: 10px;
      margin-bottom: 4px;
      color: var(--fbtool-label);
      font-size: 12px;
      font-weight: 500;
    }

    .fbtool__log {
      width: 100%;
      min-height: 120px;
      max-height: 260px;
      overflow-y: auto;
      background: var(--fbtool-deep-bg);
      border: 1px solid var(--fbtool-border-soft);
      border-radius: var(--fbtool-radius-log);
      padding: 8px;
      color: var(--fbtool-text);
      font-family: var(--fbtool-font-mono);
      font-size: 12px;
      line-height: 1.4;
      white-space: pre-wrap;
    }

    .info { color: #d4e8db; }
    .success { color: var(--fbtool-success); }
    .warning { color: var(--fbtool-warning); }
    .error { color: var(--fbtool-error); }

    .fbtool__note {
      margin-top: 8px;
      color: var(--fbtool-muted);
      font-size: 11px;
    }
  </style>
</head>

<body>
  <main class="fbtool">
    <div class="fbtool__header">
      <h1 class="fbtool__title">Campaign Cleaner</h1>
      <div class="fbtool__meta">Meta Ads Import Helper</div>
    </div>

    <label class="fbtool__label" for="fileInput">Файл экспорта</label>
    <input id="fileInput" type="file" accept=".csv,.xlsx,.xls" />

    <button id="cleanBtn" class="fbtool__btn fbtool__btn--primary" type="button">
      Очистить и скачать
    </button>

    <div class="fbtool__log-label">Лог обработки:</div>
    <div id="log" class="fbtool__log"></div>

    <div class="fbtool__note">
      Файл не отправляется на сервер. Обработка идёт локально в браузере. Статусы автоматически ставятся в PAUSED.
    </div>
  </main>

  <script>
    const FORCE_STATUS = "PAUSED";

    const jsonLikeColumnPatterns = [
      /targeting/i,
      /promoted\s*object/i,
      /creative/i,
      /object\s*story\s*spec/i,
      /asset\s*feed\s*spec/i,
      /tracking\s*specs/i,
      /conversion\s*specs/i,
      /attribution\s*spec/i,
      /degrees\s*of\s*freedom\s*spec/i,
      /frequency\s*control\s*specs/i
    ];

    const removableJsonKeys = new Set([
      "id",
      "account_id",
      "campaign_id",
      "adset_id",
      "ad_id",
      "source_campaign_id",
      "source_adset_id",
      "source_ad_id",
      "created_time",
      "updated_time",
      "effective_status",
      "insights"
    ]);

    const clearExactColumns = new Set([
      "campaign id",
      "ad set id",
      "adset id",
      "ad id",
      "source campaign id",
      "source ad set id",
      "source adset id",
      "source ad id",
      "created time",
      "last updated time",
      "reporting starts",
      "reporting ends"
    ]);

    const statusColumns = new Set([
      "campaign status",
      "ad set status",
      "adset status",
      "ad status"
    ]);

    const clearCellPatterns = [
      /(^|\b)campaign\s*id(\b|$)/i,
      /(^|\b)ad\s*set\s*id(\b|$)/i,
      /(^|\b)adset\s*id(\b|$)/i,
      /(^|\b)ad\s*id(\b|$)/i,
      /(^|\b)source\s*campaign\s*id(\b|$)/i,
      /(^|\b)source\s*ad\s*set\s*id(\b|$)/i,
      /(^|\b)source\s*adset\s*id(\b|$)/i,
      /(^|\b)source\s*ad\s*id(\b|$)/i
    ];

    const dropOnlyColumnPatterns = [
      /created\s*time/i,
      /updated\s*time/i,
      /created\s*at/i,
      /updated\s*at/i,
      /delivery/i,
      /results/i,
      /reach/i,
      /impressions/i,
      /frequency/i,
      /amount\s*spent/i,
      /^spend$/i,
      /cpm/i,
      /cpc/i,
      /ctr/i,
      /clicks/i,
      /link\s*clicks/i,
      /purchases/i,
      /conversions/i,
      /cost\s*per/i,
      /budget\s*remaining/i,
      /quality\s*ranking/i,
      /engagement\s*rate\s*ranking/i,
      /conversion\s*rate\s*ranking/i
    ];

    const els = {
      fileInput: document.getElementById("fileInput"),
      cleanBtn: document.getElementById("cleanBtn"),
      log: document.getElementById("log")
    };

    function log(message, type = "info") {
      const row = document.createElement("div");
      row.className = type;
      row.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      els.log.appendChild(row);
      els.log.scrollTop = els.log.scrollHeight;
    }

    function clearLog() {
      els.log.innerHTML = "";
    }

    function normalizeName(value) {
      return String(value ?? "").trim().toLowerCase().replace(/[_-]/g, " ");
    }

    function matchesAnyPattern(value, patterns) {
      const normalized = normalizeName(value);
      return patterns.some((pattern) => pattern.test(normalized));
    }

    function tryParseJson(value) {
      if (typeof value !== "string") return { parsed: false, value };

      const trimmed = value.trim();
      if (!trimmed) return { parsed: false, value };

      const looksJson =
        (trimmed.startsWith("{") && trimmed.endsWith("}")) ||
        (trimmed.startsWith("[") && trimmed.endsWith("]"));

      if (!looksJson) return { parsed: false, value };

      const candidates = [trimmed];

      if (trimmed.includes("'") && !trimmed.includes('"')) {
        candidates.push(trimmed.replaceAll("'", '"'));
      }

      for (const candidate of candidates) {
        try {
          return { parsed: true, value: JSON.parse(candidate) };
        } catch (_) {}
      }

      return { parsed: false, value };
    }

    function deepCleanJson(obj) {
      if (Array.isArray(obj)) {
        return obj.map((item) => deepCleanJson(item));
      }

      if (obj && typeof obj === "object") {
        const cleaned = {};

        Object.entries(obj).forEach(([key, value]) => {
          if (removableJsonKeys.has(key)) return;
          cleaned[key] = deepCleanJson(value);
        });

        return cleaned;
      }

      return obj;
    }

    function cleanCell(value, columnName) {
      const parsed = tryParseJson(value);

      if (parsed.parsed) {
        return JSON.stringify(deepCleanJson(parsed.value));
      }

      if (matchesAnyPattern(columnName, jsonLikeColumnPatterns)) {
        return value;
      }

      return value;
    }

    function shouldClearCellByColumn(column) {
      return matchesAnyPattern(column, clearCellPatterns);
    }

    function shouldDropColumn(column) {
      return matchesAnyPattern(column, dropOnlyColumnPatterns);
    }

    function cleanSheetRows(rows) {
      if (!rows.length) return { rows, droppedColumns: [] };

      const originalColumns = Object.keys(rows[0]);
      const droppedColumns = [];

      const keptColumns = originalColumns.filter((column) => {
        const drop = shouldDropColumn(column);
        if (drop) droppedColumns.push(column);
        return !drop;
      });

      const cleanedRows = rows.map((row) => {
        const cleanedRow = {};

        keptColumns.forEach((column) => {
          const normalizedColumn = normalizeName(column);

          if (clearExactColumns.has(normalizedColumn) || shouldClearCellByColumn(column)) {
            cleanedRow[column] = "";
            return;
          }

          if (statusColumns.has(normalizedColumn)) {
            cleanedRow[column] = FORCE_STATUS;
            return;
          }

          cleanedRow[column] = cleanCell(row[column], column);
        });

        return cleanedRow;
      });

      return { rows: cleanedRows, droppedColumns };
    }

    function buildOutputName(inputFileName) {
      const base = inputFileName.replace(/\.[^.]+$/, "");
      return `${base}_cleaned.csv`;
    }

    function downloadCsvFromFirstSheet(workbook, fileName) {
      const firstSheetName = workbook.SheetNames[0];
      const csv = XLSX.utils.sheet_to_csv(workbook.Sheets[firstSheetName]);
      const blob = new Blob(["\ufeff" + csv], { type: "text/csv;charset=utf-8" });
      const url = URL.createObjectURL(blob);

      const a = document.createElement("a");
      a.href = url;
      a.download = fileName;

      document.body.appendChild(a);
      a.click();
      a.remove();

      URL.revokeObjectURL(url);
    }

    function readFileAsArrayBuffer(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();

        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(reader.error);

        reader.readAsArrayBuffer(file);
      });
    }

    async function processFile() {
      clearLog();

      const file = els.fileInput.files?.[0];

      if (!file) {
        log("Сначала загрузите CSV/XLSX файл.", "error");
        return;
      }

      if (!window.XLSX) {
        log("XLSX-библиотека не загрузилась. Проверьте подключение к интернету или CDN.", "error");
        return;
      }

      els.cleanBtn.disabled = true;
      els.cleanBtn.textContent = "Обрабатываю...";

      try {
        log(`Файл: ${file.name}`, "info");
        log(`Размер: ${(file.size / 1024).toFixed(1)} KB`, "info");

        const buffer = await readFileAsArrayBuffer(file);

        const workbook = XLSX.read(buffer, {
          type: "array",
          cellDates: false,
          raw: false
        });

        const outputWorkbook = XLSX.utils.book_new();

        for (const sheetName of workbook.SheetNames) {
          const sheet = workbook.Sheets[sheetName];

          const rows = XLSX.utils.sheet_to_json(sheet, {
            defval: "",
            raw: false
          });

          log(`Лист "${sheetName}": строк ${rows.length}`, "info");

          if (!rows.length) {
            const emptySheet = XLSX.utils.aoa_to_sheet([]);
            XLSX.utils.book_append_sheet(outputWorkbook, emptySheet, sheetName.slice(0, 31));
            log(`Лист "${sheetName}" пустой, перенесён без изменений.`, "warning");
            continue;
          }

          const { rows: cleanedRows, droppedColumns } = cleanSheetRows(rows);
          const cleanedSheet = XLSX.utils.json_to_sheet(cleanedRows);

          XLSX.utils.book_append_sheet(outputWorkbook, cleanedSheet, sheetName.slice(0, 31));

          if (droppedColumns.length) {
            log(`Удалено колонок: ${droppedColumns.length}`, "success");
          } else {
            log("Опасные колонки не найдены.", "info");
          }
        }

        const outputName = buildOutputName(file.name);
        downloadCsvFromFirstSheet(outputWorkbook, outputName);

        log(`Готово. Скачан файл: ${outputName}`, "success");
      } catch (error) {
        console.error(error);
        log(error.message || String(error), "error");
      } finally {
        els.cleanBtn.disabled = false;
        els.cleanBtn.textContent = "Очистить и скачать";
      }
    }

    els.cleanBtn.addEventListener("click", processFile);

    log("Готов к работе.", "success");
  </script>
</body>
</html>
